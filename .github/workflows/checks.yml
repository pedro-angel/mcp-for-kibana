name: checks

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: these checks only read the repo — no write scope on GITHUB_TOKEN,
# which matters on a public repo where anyone can open a PR that triggers this workflow.
permissions:
  contents: read

# Cancel superseded runs on the same ref so a rapid push sequence doesn't pile up CI.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

# Re-runs the IDENTICAL .pre-commit-config.yaml, so local hooks and CI cannot drift.
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned to full commit SHAs (tag in a comment) so a moved tag can't change
      # what runs. Dependabot (.github/dependabot.yml) proposes bumps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # full history so the commit-msg range below works
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Installs pre-commit into the setup-python environment; later steps reuse it.
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
      # `--all-files` does not exercise commit-msg hooks, so lint each commit in the PR range.
      - name: commit-msg checks (PR range)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          pre-commit --version
          # --no-merges: on pull_request events HEAD is GitHub's synthetic merge commit
          # ("Merge <sha> into <sha>"), which carries no conventional prefix or trailer —
          # without this every human PR fails the gate on a commit nobody authored.
          for sha in $(git rev-list --no-merges "$BASE_SHA"..HEAD); do
            # Skip bot commits (e.g. Dependabot): they carry a conventional prefix but no
            # provenance trailer, and are trusted, machine-generated changes.
            author_email=$(git log -1 --format=%ae "$sha")
            case "$author_email" in
              *"[bot]"*|*dependabot*) continue ;;
            esac
            git log -1 --format=%B "$sha" > /tmp/commit-msg
            pre-commit run --hook-stage commit-msg --commit-msg-filename /tmp/commit-msg --all-files
          done

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Gates
        run: |
          uv sync --group docs   # --group adds to the default groups (dev), so this installs dev + docs
          # Call the make leaves (this is `check` minus `hooks` — hooks is the pre-commit
          # job above) so the command strings live once, in the recipes: CI cannot drift
          # from what `make check` runs locally.
          make lint audit sast test docs
      - name: Wheel gate — installed package serves the in-band docs
        run: make package

  # Exercise the widened Python floor (>=3.12) across the whole supported range so
  # a 3.13/3.14-only feature can't slip past the single-interpreter `python` job.
  # Unit tier only (fakes, no stack); coverage gate rides along via `make test`.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Unit tests + coverage (Python ${{ matrix.python-version }})
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: |
          uv sync            # dev is uv's default group -> pytest + pytest-cov
          make test          # same recipe humans run; gate reads fail_under from pyproject

  image:
    # Fork PRs must NOT run this job: `make build` does `docker build` (which
    # executes fork-authored Dockerfile RUN layers) and `docker run`. Restrict the
    # WHOLE job to same-repo refs so, once public, a fork PR can't run arbitrary
    # code in our runner. Pushes and same-repo-branch PRs still build+smoke.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [python]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `make build` builds mcp-for-kibana:dev AND smoke-tests it (scripts/checks/image-smoke.sh):
      # single source for the build recipe, and CI now verifies the image boots before pushing.
      - name: Build & smoke-test image
        run: make build
      - name: Push (main only)
        id: push
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Re-tag the smoke-verified local image and publish the exact bytes we verified.
          docker tag mcp-for-kibana:dev ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          docker tag mcp-for-kibana:dev ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:latest
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/${{ github.repository }}:sha-${{ github.sha }} | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          # States the input the attest step below is gated on, so a skipped attestation is
          # always attributable: "private" means correctly skipped, an EMPTY value means the
          # gate is misreading the payload and attestation would never fire, even once public.
          echo "pushed $digest; repo visibility: '${{ github.event.repository.visibility }}'"
      # GitHub's attestation API refuses user-owned private repos outright ("Feature not
      # available for user-owned private repositories"): on Free/Pro/Team the feature is
      # public-repo-only, and a private repo needs enterprise ownership on GHEC. Gate on the
      # pushed repo's visibility (a required field of the push payload's repository object)
      # so main stays green while the repo is private, and attestation switches itself on at
      # the public flip with no workflow edit. Any OTHER attestation failure still fails the
      # job — this skips the step, it does not swallow errors.
      - name: Attest build provenance (main, public repo only)
        if: github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
