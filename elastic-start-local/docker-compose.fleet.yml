# Fleet Server + one enrolled demo agent — ALWAYS part of the dev/test stack
# (the MCP server exposes a `fleet` toolbox, so fleet must be running and
# contract-tested; unlike the opt-in APM overlay). Joins -p mcp-for-kibana-stack and
# reaches Elasticsearch over the network at http://elasticsearch:9200 in PLAIN
# HTTP — the stack runs no TLS, so FLEET_SERVER_INSECURE_HTTP + FLEET_INSECURE.
#
# The fleet-server self-registers as one agent; the demo agent enrolls into it —
# so `list_agents` always has non-empty data. Both credentials (the service
# token and the enrollment token) are minted at runtime by scripts/stack.sh into
# the gitignored .env.fleet; the two agent policies are created with
# monitoring_enabled:[] so the agents report healthy without an in-container
# monitoring output (the default output points at localhost:9200, unreachable
# inside a container, which leaves the agents stuck 'degraded'). The
# elastic-agent image ships no compose-usable healthcheck, so `--wait` returns on
# "running"; scripts/stack.sh polls :8220/api/status for HEALTHY.
#
# NOTE: two callers load this overlay. scripts/stack.sh (the dev/test stack)
# starts `fleet-server fleet-agent` only. scripts/fleet_ephemeral.sh (the isolated
# mcp-for-kibana-fleet-ephemeral project) ALSO starts `fleet-agent-2` — a second
# sacrificial agent for battle-testing the agent-lifecycle tools. The isolated
# ephemeral STREAMS stack (scripts/ephemeral_stack.sh) does NOT load it, so that
# stack stays lean.
services:
  fleet-server:
    depends_on:
      elasticsearch:
        condition: service_healthy
    image: docker.elastic.co/elastic-agent/elastic-agent:${ES_LOCAL_VERSION}
    container_name: ${FLEET_LOCAL_CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - 127.0.0.1:${FLEET_LOCAL_PORT}:8220
    environment:
      FLEET_SERVER_ENABLE: "true"
      # Bootstrap mode: fleet-server connects DIRECTLY to ES with the service
      # token (no Kibana leg), so only the ES host + token are needed here.
      FLEET_SERVER_ELASTICSEARCH_HOST: "http://elasticsearch:9200"
      FLEET_SERVER_SERVICE_TOKEN: "${FLEET_SERVER_SERVICE_TOKEN}"
      FLEET_SERVER_POLICY_ID: "fleet-server-policy"
      FLEET_SERVER_INSECURE_HTTP: "true"   # expose :8220 over plain HTTP (default is HTTPS)
      FLEET_SERVER_HOST: "0.0.0.0"
      FLEET_SERVER_PORT: "8220"
    volumes:
      # Persist the agent identity so a stop/start returns the SAME enrolled agent.
      # Without this volume each restart enrolls a NEW agent id and the stale ones
      # pile up offline in Fleet — confirmed by restarting the stack both ways.
      - dev-fleet-server:/usr/share/elastic-agent/state

  fleet-agent:
    depends_on:
      fleet-server:
        condition: service_started
    image: docker.elastic.co/elastic-agent/elastic-agent:${ES_LOCAL_VERSION}
    container_name: ${FLEET_AGENT_LOCAL_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      FLEET_ENROLL: "1"
      FLEET_URL: "http://fleet-server:8220"        # reach the fleet-server on the compose network
      FLEET_ENROLLMENT_TOKEN: "${FLEET_ENROLLMENT_TOKEN}"
      FLEET_INSECURE: "true"                        # the fleet-server speaks plain HTTP
    volumes:
      - dev-fleet-agent:/usr/share/elastic-agent/state

  # A SECOND sacrificial enrolled agent — started ONLY by scripts/fleet_ephemeral.sh
  # (the isolated mcp-for-kibana-fleet-ephemeral project), which needs two agents to
  # battle-test the fleet agent-lifecycle tools (reassign/upgrade/unenroll one
  # while the other stays a live control). The dev stack (scripts/fleet_stack.sh)
  # never starts this service — it brings up only `fleet-server fleet-agent` by
  # name — so its container-name var defaults here and is left unset in the dev
  # .env (no compose warning). It enrolls into the same fleet-agent-policy with
  # the same enrollment token; a separate state volume gives it its own agent id.
  fleet-agent-2:
    depends_on:
      fleet-server:
        condition: service_started
    image: docker.elastic.co/elastic-agent/elastic-agent:${ES_LOCAL_VERSION}
    container_name: ${FLEET_AGENT2_LOCAL_CONTAINER_NAME:-mcp-for-kibana-fleet-agent-2-local}
    restart: unless-stopped
    environment:
      FLEET_ENROLL: "1"
      FLEET_URL: "http://fleet-server:8220"        # reach the fleet-server on the compose network
      FLEET_ENROLLMENT_TOKEN: "${FLEET_ENROLLMENT_TOKEN}"
      FLEET_INSECURE: "true"                        # the fleet-server speaks plain HTTP
    volumes:
      - dev-fleet-agent-2:/usr/share/elastic-agent/state

volumes:
  dev-fleet-server:
  dev-fleet-agent:
  dev-fleet-agent-2:
