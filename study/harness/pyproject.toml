[project]
name = "mcp-savings-study-harness"
version = "0.0.0"
description = "Harness for the mcp-for-kibana savings study"
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-proto>=1.45",
    "protobuf>=7.35",
]

[dependency-groups]
dev = ["pytest>=9.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
