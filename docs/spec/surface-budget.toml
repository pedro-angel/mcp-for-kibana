# The surface budget (D60): caps on what a model is handed, held by
# tests/unit/test_surface_budget.py inside unit_green.
#
# [surface.<name>] caps a surface: the default selection, each shipped profile
# (profiles/*.mcp.json), each toolbox at `destructive`, and every toolbox at
# `destructive` together, by tool count, total description characters and
# total input-schema characters (compact JSON, as the tool listing sends it).
# [per_tool] caps every single tool; [per_tool.exceptions.<tool>] lifts one
# tool's cap (none today).
#
# Every cap cites the decision in docs/spec/decisions.md that sets it; that
# entry states it as `budget <name>: N tools, N description_chars, N
# input_schema_chars` (per-tool caps: `budget per-tool: ...`, an exception
# `budget tool:<name>: ...`) and says Why. To raise a cap, write a NEW
# decision that states the new numbers and why the growth is worth it — a new
# tool alone is not a reason (owner rule) — and cite it here. D60 set the
# caps at the values measured 2026-10-27 plus 5 % (characters rounded up to
# the next 100; tool counts +5 %, at least one).


