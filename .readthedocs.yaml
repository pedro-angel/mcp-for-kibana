# Read the Docs build for mcp-for-kibana.
#
# build.commands (not the `mkdocs:` key) because the docs dependencies live in
# PEP 735 [dependency-groups], which RTD's pip-based install cannot reach. Running
# the repo's own uv invocation keeps ONE source for what the docs need: the same
# `uv run --group docs mkdocs build --strict` that `make docs` and CI run, so the
# hosted site cannot drift from the gate. --strict replaces mkdocs.fail_on_warning,
# which build.commands ignores.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - pip install uv
    - uv run --group docs mkdocs build --strict --site-dir $READTHEDOCS_OUTPUT/html
